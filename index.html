<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HealthForge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* HealthForge design system: one calm canvas. Hairlines and whitespace instead of boxes. */
:root{
  --bg:#080a0f; --bg2:#0b0f15; --panel:#0e131b; --panel2:#131a24; --panel3:#1a2330;
  --line:rgba(160,185,230,.10); --line2:rgba(160,185,230,.22);
  --txt:#eaf0fa; --mut:#93a2bb; --dim:#64738c;
  --blue:#4ea3ff; --cyan:#27d3ee; --violet:#9d8cff; --ok:#3fdba5; --warn:#f3b94f; --bad:#ff7080;
  --glow:0 0 0 1px rgba(78,163,255,.35);
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --r:12px; --nav-h:64px; --side-w:232px; --gap:40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 420px at 70% -8%,rgba(78,163,255,.07),transparent 65%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt)}
svg{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--blue)}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100vh;display:flex}
.side{width:var(--side-w);flex:none;position:sticky;top:0;height:100vh;padding:30px 14px 22px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:11px;padding:0 12px 30px}
.brand svg{width:30px;height:30px}
.brand b{display:block;font-size:15px;letter-spacing:2.2px;font-weight:700}
.brand small{display:none}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--mut);text-align:left;width:100%;font-size:15px;transition:color .15s,background .15s;position:relative}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{color:var(--txt)}
.nav-item.on{color:var(--txt);background:rgba(160,185,230,.07)}
.nav-item.on svg{color:var(--blue)}
.side .grow{flex:1}
.rank-mini{padding:14px 12px 0;border-top:1px solid var(--line);margin-top:10px}
.rank-mini .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mut)}
.rank-mini b{color:var(--txt);font-size:14px}
.bar{height:4px;border-radius:4px;background:rgba(160,185,230,.14);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}

.main{flex:1;min-width:0;padding:44px clamp(20px,5vw,64px) 90px;max-width:900px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.topbar .ttl{flex:1;min-width:0}
.topbar h1{font-size:clamp(27px,3.6vw,36px);font-weight:500;letter-spacing:-.4px;line-height:1.15}
.topbar .sub{color:var(--mut);font-size:14.5px;margin-top:5px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--mut);transition:.15s}
.icon-btn:hover{color:var(--txt);background:rgba(160,185,230,.08)}
.icon-btn svg{width:20px;height:20px}
.topbar .icon-btn{display:none}
.mobile-brand{display:none}

.tabbar{display:none}
@media (max-width:899px){
  .side{display:none}
  .main{padding:22px 20px calc(var(--nav-h) + 96px)}
  .topbar{margin-bottom:24px}
  .topbar .icon-btn{display:grid}
  .mobile-brand{display:flex;align-items:center}
  .mobile-brand svg{width:28px;height:28px}
  .mobile-brand b{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);z-index:30;background:rgba(8,10,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;letter-spacing:.3px;border-radius:12px;position:relative}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button.on{color:var(--blue)}
}

/* ---------- sections (formerly panels) ---------- */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.c12,.c8,.c7,.c6,.c5,.c4,.c3{grid-column:auto;min-width:0}
.view .grid:has(>.panel),.view .grid:has(>[class*="c"]>.panel),.view>.grid{gap:var(--gap)}
.panel{position:relative;padding:28px 0 0;border-top:1px solid var(--line)}
.view .grid:first-child>:first-child .panel:first-child,.view>.row:first-child+.grid>:first-child .panel:first-child,.view>.grid>:first-child>.panel:first-child{border-top:0;padding-top:0}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.ph svg{display:none}
.ph h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:600;flex:1}
.ph .tag{font-family:var(--mono);font-size:12px;color:var(--dim)}
.big{font-family:var(--mono);font-size:38px;font-weight:500;letter-spacing:-1px;line-height:1.1}
.med{font-family:var(--mono);font-size:22px;font-weight:500}
.lbl{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.5px}
.stat .v small{font-size:13px;color:var(--mut);font-weight:400;margin-left:4px;letter-spacing:0}
.stat .d{font-size:13px;font-family:var(--mono)}
.up{color:var(--ok)}.dn{color:var(--ok)}.flat{color:var(--mut)}.warnc{color:var(--warn)}.badc{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap8{gap:8px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:18px}.mt24{margin-top:28px}
hr.sep{border:0;border-top:1px solid var(--line);margin:20px 0}
.note{font-size:14px;color:var(--mut);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:0;background:rgba(160,185,230,.09);font-size:12px;color:var(--mut);font-family:var(--mono)}
.chip.b{color:var(--blue);background:rgba(78,163,255,.12)}
.chip.v{color:var(--violet);background:rgba(157,140,255,.12)}
.chip.ok{color:var(--ok);background:rgba(63,219,165,.12)}
.chip.w{color:var(--warn);background:rgba(243,185,79,.12)}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:10px;border:1px solid var(--line2);background:rgba(160,185,230,.04);color:var(--txt);font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{background:rgba(160,185,230,.09);border-color:rgba(160,185,230,.34)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#06111f}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--txt);background:rgba(160,185,230,.07)}
.btn.sm{padding:7px 14px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--bad);border-color:rgba(255,112,128,.3)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.inp,select.inp,textarea.inp{width:100%;background:rgba(160,185,230,.05);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s,background .15s;min-width:0}
.inp:focus{border-color:var(--blue);background:rgba(160,185,230,.07)}
textarea.inp{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.seg{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:6px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:none;padding:0;border-radius:0}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:10px 0 12px;color:var(--mut);font-size:15px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.seg button:hover{color:var(--txt)}
.seg button.on{color:var(--txt);border-bottom-color:var(--blue);background:none;box-shadow:none}
.view>.row:first-child{margin-bottom:30px!important}
.choice{display:grid;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut);transition:.15s;text-align:center}
.opt svg{width:30px;height:30px}
.opt b{color:var(--txt);font-size:15px}
.opt small{font-size:12.5px;line-height:1.3}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--blue);background:rgba(78,163,255,.08);color:var(--blue)}
.dots{display:flex;gap:8px}
.dots button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:transparent;font-family:var(--mono);font-weight:600;color:var(--mut)}
.dots button.on{background:var(--blue);color:#06111f;border-color:var(--blue)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;font-size:16px}
.li .s{font-size:13.5px;color:var(--mut);margin-top:1px}
.mission{display:flex;align-items:center;gap:16px;padding:16px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;margin:0}
.mission:last-of-type{border-bottom:0}
.mission .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.mission .ck svg{width:15px;height:15px}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:#03160f}
.mission .t{font-weight:600;font-size:16px}
.mission.done .t{color:var(--mut);font-weight:500}
.mission .s{font-size:13.5px;color:var(--mut)}
.mission .mbar{height:2px;background:rgba(160,185,230,.12);border-radius:2px;margin-top:9px;overflow:hidden;max-width:260px}
.mission .mbar i{display:block;height:100%;background:var(--blue)}
.mission.done .mbar i{background:var(--ok)}
.mission .grow{flex:1;min-width:0}

/* today hero */
.hero{display:flex;align-items:center;gap:clamp(24px,5vw,56px);flex-wrap:wrap}
.hero .hero-stats{flex:1;min-width:240px;display:flex;flex-direction:column;gap:20px}
.hs .row{align-items:baseline;justify-content:space-between}
.hs .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.5px}
.hs .v small{font-size:13px;color:var(--mut);font-weight:400;margin-left:5px;letter-spacing:0}
.hs .bar{height:3px;margin-top:8px}
.hs .bar i.v{background:var(--violet)} .hs .bar i.c{background:var(--cyan)}
.lnk{background:none;border:0;padding:0;color:var(--mut);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.lnk:hover{color:var(--txt)}
.quick{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;min-height:60px}
.chart svg{overflow:visible;width:100%}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--dim)}
.tip{position:absolute;pointer-events:none;z-index:5;background:rgba(8,11,16,.97);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.tip b{font-family:var(--mono)}
.tip .k{color:var(--mut)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap .ctr{position:absolute;text-align:center}

/* ---------- overlays ---------- */
#sheet,#stage{position:fixed;inset:0;z-index:80;display:none}
#sheet.open,#stage.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(5px);animation:fade .2s}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;background:#10161f;border:1px solid var(--line2);border-radius:18px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .22s}
.sheet h2{font-size:21px;margin-bottom:6px;font-weight:600}
.sheet .x{position:absolute;top:14px;right:14px}
@media (max-width:699px){
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:slide .26s}
}
.stagebox{position:absolute;inset:0;background:radial-gradient(800px 500px at 50% 0%,rgba(78,163,255,.09),transparent 65%),var(--bg);display:flex;flex-direction:column;overflow:auto;animation:fade .25s}
.stagebox .head{display:flex;align-items:center;gap:12px;padding:18px clamp(18px,4vw,40px)}
.stagebox .head .grow{flex:1}
.stagebox .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:10px clamp(18px,4vw,40px) 44px;text-align:center;width:100%;max-width:720px;margin:0 auto}
.fig{width:min(300px,70vw);aspect-ratio:120/96;border-radius:16px;border:1px solid var(--line);background:rgba(160,185,230,.025)}
.fig .eq{stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fig .floor{stroke:var(--line2);stroke-width:1.5}
.fig .fb{fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.timer-big{font-family:var(--mono);font-size:clamp(54px,12vw,92px);font-weight:500;letter-spacing:-2px;line-height:1}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:9px;padding:11px 18px 11px 14px;border-radius:999px;border:1px solid rgba(157,140,255,.4);background:rgba(18,16,40,.92);color:#e6e1ff;font-weight:600;font-size:14.5px;backdrop-filter:blur(8px)}
.fab:hover{border-color:rgba(157,140,255,.7)}
.fab svg{width:20px;height:20px;color:var(--violet)}
@media (min-width:900px){.fab{bottom:28px;right:34px}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:120;background:#121a26;border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:32px}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(243,185,79,.08);font-size:14px;color:#e8d3a4;margin-bottom:14px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes aura{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.view{animation:fade .28s}
.aura{transform-origin:center;animation:aura 9s ease-in-out infinite}
.aura.b{animation-delay:-3s}.aura.c{animation-delay:-6s}

/* misc */
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--mut)}
.badge svg{width:56px;height:56px}
.badge.off{opacity:.38;filter:grayscale(1)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:10px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;text-align:center;color:var(--mut);font-size:14px}
.empty svg{width:96px;height:72px;opacity:.8}
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.onb .wrapbox{width:min(640px,100%);padding:36px 22px 56px;display:flex;flex-direction:column;gap:20px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line2)}.steps i.on{background:var(--blue)}
details.acc{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;margin-bottom:0}
details.acc summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--mut);font-family:var(--mono);font-size:18px}
details.acc[open] summary::after{content:"\2212"}
details.acc .in{padding:0 0 18px}
.ex-card{display:flex;gap:16px;align-items:center}
.ex-card .fig{width:112px;flex:none;border-radius:10px}
.kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--line2);border-radius:6px;color:var(--mut)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13.5px;color:var(--mut);font-weight:500}
.pill:hover{color:var(--txt);border-color:var(--line2)}
.pill.on{color:var(--blue);border-color:transparent;background:rgba(78,163,255,.14)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1c2736;border-radius:10px}::-webkit-scrollbar-track{background:transparent}

.figpair{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;width:100%}
.figpair .fig{width:min(270px,44vw);flex:0 1 auto}
.fig .vl{font-family:var(--mono);font-size:6px;letter-spacing:1px;fill:var(--dim)}
.fig .eq rect{fill:rgba(160,185,230,.07)}
.fig .eq .wl{stroke:none;fill:rgba(160,185,230,.05)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.libcard{position:relative;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;transition:.15s;display:block;width:100%}
.libcard:hover{border-color:var(--line2);background:rgba(160,185,230,.04)}
.libcard .fig{width:100%;margin-bottom:8px;border-color:transparent}
.libcard .t{font-weight:600;font-size:14.5px;line-height:1.25}
.libcard .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.libcard .libq{position:absolute;top:16px;right:16px;z-index:2}

.box{padding:16px 18px;border-radius:12px;background:rgba(160,185,230,.05)}

@media (max-width:600px){
  .hero{justify-content:center;gap:24px}
  .hero .hero-stats{min-width:100%}
  .topbar h1{font-size:25px}
  .mobile-brand{display:none}
  .btn{padding:12px 20px}
  .li{gap:12px}
}

.ui-pop{position:fixed;z-index:200;background:#121923;border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;overflow:auto;animation:popin .14s ease-out}

.sel-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--txt)}

.sel-opt.on{color:var(--blue)}

.dp-pop{width:296px;padding:14px}
.dp-head{display:flex;align-items:center;gap:4px;margin-bottom:10px}

input[type=number]{-moz-appearance:textfield;appearance:textfield}

function ico(n, cls){ return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`; }

/* meditation visual: nested soft rings, slow drift (not a breathing guide) */
function auraSvg(pct){
  return `<svg viewBox="0 0 300 300" width="min(300px,72vw)" height="min(300px,72vw)"><defs>
  <radialGradient id="ag" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#3b9cff" stop-opacity="0"/></radialGradient></defs>

/* ===== HealthForge: 3D-skeleton stick figures, rendered from two angles =====
   World: y up (floor y=0), z = direction the person faces (side view right), x lateral.
   Pose keys: P pelvis [x,y,z]; lean/sway/yaw torso degrees (lean + = forward, - = backward);
   N neck target [x,y,z] (overrides lean/sway); hp/ht head pitch/tilt;
   A [upperA,upperB,foreA,foreB] FK both arms (AL/AR override); angle a: 0 down, 90 +z, 180 up; b: outward.
   T [thighA,thighB,shinA,shinB] FK both legs (TL/TR override).
   H [y,z,xo] hand IK (HL/HR [x,y,z] override); F [y,z,xo] foot IK (FL/FR override); ep/kp elbow/knee pole.
   fit: shift so lowest joint sits on the floor (default when no foot IK). */
const D2R=Math.PI/180;
const v3={add:(a,b,s=1)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  len:a=>Math.hypot(a[0],a[1],a[2]),nrm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}};
const dirv=(a,b,sx)=>{a*=D2R;b*=D2R;return [sx*Math.sin(b),-Math.cos(b)*Math.cos(a),Math.cos(b)*Math.sin(a)];};
const upv=(pitch,side)=>{pitch*=D2R;side*=D2R;return [Math.sin(side),Math.cos(pitch)*Math.cos(side),Math.sin(pitch)*Math.cos(side)];};
function ik2(root,target,l1,l2,pole){
  const d0=v3.sub(target,root); const d=Math.max(0.01,v3.len(d0)); const u=v3.nrm(d0); const dd=Math.min(d,l1+l2-0.05);
  const a=(l1*l1-l2*l2+dd*dd)/(2*dd), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const pr=v3.sub(pole,u.map(x=>x*v3.dot(pole,u))); const n=v3.nrm(pr);
  return {mid:v3.add(v3.add(root,u,a),n,h),end:v3.add(root,u,dd)};
}
const POSE_DEF={lean:0,sway:0,yaw:0,hp:0,ht:0,A:[0,6,0,4],T:[0,0,0,0]};
function solvePose(o){
  o=Object.assign({},POSE_DEF,o); const P=o.P||[0,36,0]; let tv, lean=o.lean, sway=o.sway;
  if(o.N){ tv=v3.nrm(v3.sub(o.N,P)); lean=Math.atan2(tv[2],tv[1])/D2R; sway=Math.asin(clampN(tv[0],-1,1))/D2R; } else tv=upv(lean,sway);
  const N=v3.add(P,tv,24), y=o.yaw*D2R, sw=sway*D2R;
  const lat=v3.nrm([Math.cos(sw)*Math.cos(y),-Math.sin(sw),Math.cos(sw)*Math.sin(y)]);
  const py=(o.pyaw||0)*D2R, hs=(o.hsway||0)*D2R, hlat=v3.nrm([Math.cos(hs)*Math.cos(py),-Math.sin(hs),Math.cos(hs)*Math.sin(py)]);
  const J={P,N,sR:v3.add(N,lat,9),sL:v3.add(N,lat,-9),hR:v3.add(P,hlat,6),hL:v3.add(P,hlat,-6)};

    xd.setAttribute('cx',X);xd.setAttribute('cy',g.Y(best.y));xd.style.display='';
    show(X,g.Y(best.y)-4, sp.tipfn? sp.tipfn(best,sp) : `<span class="k">${fmtD(fromNum(best.x))}</span> <b>${(sp.yfmt||r1)(best.y)}</b>`);
  };
  el.onpointerleave=hide;
}

let lastXP=0, ticks=[], wake=null, AC=null;
function toast(msg){ let t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2600); }
function touch(msg,norender){ const nx=totalXP(), d=nx-lastXP; lastXP=nx; save(); if(msg) toast(msg+(d>0?'   +'+d+' XP':'')); if(!norender) render(); }
function bell(vol=.22){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const t=AC.currentTime;
  [[528,1],[792,.4],[1056,.18]].forEach(([f,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+3.3);}); }catch(e){} }
function tickEvery(fn,ms=250){ const id=setInterval(fn,ms); ticks.push(id); return id; }
function clearTicks(){ ticks.forEach(clearInterval); ticks=[]; }
async function keepAwake(){ try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function release(){ try{ wake&&wake.release(); }catch(e){} wake=null; }

const stageHead=(title,sub)=>`<div class="head"><div class="grow" style="text-align:left"><div class="lbl">${esc(sub||'')}</div><h2 style="font-size:20px">${esc(title)}</h2></div><button class="icon-btn" data-act="stageClose" aria-label="Close session">${ico('close')}</button></div>`;

/* ---------- strength ---------- */
function strengthStage(rid,mini){
  const myR=rid.startsWith('my:')?routineById(rid.slice(3)):null; const R=myR?{id:rid,name:myR.name,items:myR.items}:rid==='custom'?{id:'custom',name:'My workout',items:S.queue.map(id=>[id,EXERCISES[id].sets,EXERCISES[id].reps])}:ROUTINES[rid]; let items=R.items.map(x=>({id:x[0],sets:x[1],reps:x[2]}));
  if(mini) items=items.slice(0,2).map(x=>({...x,sets:2}));
  const steps=[]; items.forEach((it,i)=>{ for(let s=1;s<=it.sets;s++){ steps.push({t:'work',it,s,i}); if(!(i===items.length-1&&s===it.sets)) steps.push({t:'rest',it,s,i}); } });
  let idx=0, t0=Date.now(), rest=0, restEnd=0, rpe=0;
  const paint=()=>{ clearTicks(); const st=steps[idx];
    if(!st) return finish();
    const ex=EXERCISES[st.it.id];
    const prog=`<div class="bar" style="width:min(320px,80vw)"><i style="width:${Math.round(idx/steps.length*100)}%"></i></div>`;

      setStage(stageHead('Rest','Next: '+nex.name)+`<div class="body"><div id="rr"></div><p class="note">Next up: <b>${esc(nex.name)}</b>, set ${nx.s} of ${nx.it.sets}</p>${prog}<div class="row" style="justify-content:center"><button class="btn" id="pl">+15 sec</button><button class="btn pri" id="sr">${ico('skip')} Skip rest</button></div></div>`);
      const u=()=>{ const r=(restEnd-Date.now())/1000; $('#rr').innerHTML=ring(1-r/S.settings.restSec,220,'#9381ff',mmss(r),'rest',10,'#3b9cff'); if(r<=0){bell(.12);idx++;paint();} };
      u(); tickEvery(u,250); $('#pl').onclick=()=>{restEnd+=15000;}; $('#sr').onclick=()=>{idx++;paint();};
    } };
  const finish=()=>{ clearTicks(); const min=Math.max(1,Math.round((Date.now()-t0)/60000));
    setStage(stageHead('Session complete',R.name)+`<div class="body"><div style="color:var(--ok);width:90px">${ico('check')}</div><h2>Nice work. ${min} minutes.</h2>

    <button class="btn pri" id="sv" style="padding:14px 28px">${ico('check')} Save session</button></div>`);

/* ---------- stretch ---------- */

const dronePick=()=>DPRE[S.settings.drone]?S.settings.drone:'off';
const rnd=(a,b)=>a+Math.random()*(b-a);

function reverbIR(c,sec){ const n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2,n,c.sampleRate); for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6); } return b; }
function brownNoise(c,sec){ const n=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; l=(l+0.02*w)/1.02; d[i]=l*3.5; } return b; }
function whiteNoise(c,sec){ const n=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
function pinkNoise(c,sec){ const n=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; } return b; }
// per-sound space: reverb length, wet and dry levels
const DREV={abyss:{sec:11,wet:.9,dry:.55},cavern:{sec:9,wet:.95,dry:.5},ritual:{sec:10,wet:.95,dry:.5},night:{sec:4,wet:.5,dry:.8},forest:{sec:3,wet:.35,dry:.9},rain:{sec:2,wet:.25,dry:1},storm:{sec:4,wet:.45,dry:.9},fire:{sec:2,wet:.2,dry:1},ocean:{sec:4,wet:.4,dry:.9}};
const DTRIM={earth:.65,choir:.55,pad:1.3,ocean:.85,forest:1.1,rain:1.35,storm:2.3,night:3.5,fire:1.25,abyss:.55,cavern:2.2,ritual:.5};

/* helper used by presets: a gain-shaped noise voice -> filter chain -> bus */
function gainNode(c,v,nodes){ const g=c.createGain(); g.gain.value=v; nodes.push(g); return g; }

const DPRE={
  earth:({osc,lfo,filt,bus})=>{ const lp=filt('lowpass',420); lp.connect(bus);
    osc('sine',32.7,.35,0,lp); osc('sine',65.41,.5,0,lp); osc('triangle',65.41,.16,4,lp); osc('sine',98,.32,-3,lp); osc('sine',130.81,.2,2,lp);
    lfo(lp.frequency,.045,150); },
  pad:({osc,lfo,filt,bus})=>{ const lp=filt('lowpass',650); lp.connect(bus);
    [73.42,110,146.83,220,293.66].forEach((f,i)=>{ const a=i>3?.04:.085; osc('sawtooth',f,a,-7,lp); osc('sawtooth',f,a,7,lp); });
    lfo(lp.frequency,.05,200); lfo(bus.gain,.07,.1); },
  choir:({osc,lfo,bus})=>{ for(let n=1;n<=8;n++){ const a=.5/Math.pow(n,.85); const s=osc('sine',55*n,a,(Math.random()-.5)*6,bus); lfo(s.g.gain,.02+Math.random()*.08,a*.8); } },
  ocean:({c,noise,osc,lfo,filt,bus,nodes})=>{ const src=noise('brown'); const lp=filt('lowpass',500), ng=gainNode(c,.55,nodes); src.connect(lp); lp.connect(ng); ng.connect(bus);
    lfo(ng.gain,.09,.35); lfo(lp.frequency,.07,250); osc('sine',55,.22,0,bus); osc('sine',82.4,.08,3,bus); },

  /* ----- nature ----- */
  forest:({c,noise,lfo,filt,bus,nodes,timers})=>{
    // low body of the wind
    const lo=filt('lowpass',260), gLo=gainNode(c,.7,nodes); noise('brown').connect(lo); lo.connect(gLo); gLo.connect(bus); lfo(gLo.gain,.035,.3);
    // rustling leaves, swelling in gusts
    const bp=filt('bandpass',850,.7), gLeaf=gainNode(c,.12,nodes); noise('pink').connect(bp); bp.connect(gLeaf); gLeaf.connect(bus);
    // high air through the needles
    const hi=filt('bandpass',4800,.8), gHi=gainNode(c,.018,nodes); noise('white').connect(hi); hi.connect(gHi); gHi.connect(bus);
    // slower canopy movement
    const mid=filt('bandpass',420,.5), gMid=gainNode(c,.2,nodes); noise('pink').connect(mid); mid.connect(gMid); gMid.connect(bus); lfo(gMid.gain,.06,.12); lfo(mid.frequency,.04,120);
    let next=c.currentTime+1.5; const tick=()=>{ if(c.currentTime+1<next) return; const t=next, rise=rnd(3,6), fall=rnd(4,9), amp=rnd(.5,1.2);
      gLeaf.gain.setTargetAtTime(.12+amp*.34,t,rise/3); gLeaf.gain.setTargetAtTime(.12,t+rise,fall/3);
      bp.frequency.setTargetAtTime(700+amp*650,t,rise/3); bp.frequency.setTargetAtTime(850,t+rise,fall/3);
      gHi.gain.setTargetAtTime(.018+amp*.05,t,rise/3); gHi.gain.setTargetAtTime(.018,t+rise,fall/3);
      gLo.gain.setTargetAtTime(.7+amp*.35,t,rise/3); gLo.gain.setTargetAtTime(.7,t+rise,fall/3);
      next=t+rise+fall+rnd(0,4); };
    tick(); timers.push(setInterval(tick,400)); },
  rain:({c,noise,lfo,filt,bus,nodes,timers})=>{ rainBed(c,noise,lfo,filt,bus,nodes,timers,1); },
  storm:({c,noise,lfo,filt,bus,nodes,timers})=>{ rainBed(c,noise,lfo,filt,bus,nodes,timers,.55);
    const buf=brownNoise(c,14);
    const rumble=(t,peak)=>{ const s=c.createBufferSource(); s.buffer=buf; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(rnd(300,500),t); lp.frequency.exponentialRampToValueAtTime(60,t+9);
      const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+rnd(.6,1.6)); g.gain.exponentialRampToValueAtTime(.0005,t+rnd(8,12)); s.connect(lp); lp.connect(g); g.connect(bus); s.start(t,rnd(0,2)); s.stop(t+12.5); };
    let next=c.currentTime+5; const tick=()=>{ if(c.currentTime+1<next) return; const t=next; rumble(t,rnd(.9,1.5)); if(Math.random()<.6) rumble(t+rnd(1.2,2.6),rnd(.4,.8)); next=t+rnd(22,50); };
    tick(); timers.push(setInterval(tick,500)); },
  night:({c,noise,lfo,filt,bus,nodes,timers,srcs})=>{
    const lp=filt('lowpass',500), gb=gainNode(c,.05,nodes); noise('pink').connect(lp); lp.connect(gb); gb.connect(bus); lfo(gb.gain,.05,.03);
    for(let i=0;i<5;i++){ const o=c.createOscillator(); o.type='sine'; o.frequency.value=rnd(2100,2800); const am=gainNode(c,.03,nodes), gate=gainNode(c,.5,nodes); o.connect(am); am.connect(gate); gate.connect(bus); o.start();
      lfo(am.gain,rnd(17,31),.03); lfo(gate.gain,rnd(.12,.42),.5); srcs.push(o); }
    const hoot=t=>{ [0,.95].forEach((dt,k)=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(430-k*30,t+dt); o.frequency.exponentialRampToValueAtTime(380-k*30,t+dt+.5); const g=c.createGain(); g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(.09,t+dt+.12); g.gain.exponentialRampToValueAtTime(.0005,t+dt+.9); o.connect(g); g.connect(bus); o.start(t+dt); o.stop(t+dt+1); }); };
    let next=c.currentTime+rnd(8,16); const tick=()=>{ if(c.currentTime+1<next) return; hoot(next); next+=rnd(25,50); }; tick(); timers.push(setInterval(tick,600)); },
  fire:({c,noise,lfo,filt,bus,nodes,timers})=>{
    // flame body: a soft, low roar that breathes and occasionally swells
    const lp=filt('lowpass',380), body=gainNode(c,.3,nodes); noise('brown').connect(lp); lp.connect(body); body.connect(bus); lfo(body.gain,.45,.07); lfo(lp.frequency,.2,70);
    // flicker: quiet mid-range movement, like air pulling through burning wood
    const bp=filt('bandpass',520,.8), fl=gainNode(c,.05,nodes); noise('pink').connect(bp); bp.connect(fl); fl.connect(bus); lfo(fl.gain,2.8,.025); lfo(fl.gain,6.5,.015); lfo(bp.frequency,.3,120);
    let nx=c.currentTime+2; const swell=()=>{ if(c.currentTime+1<nx) return; const t=nx; body.gain.setTargetAtTime(.3+rnd(.05,.11),t,.5); body.gain.setTargetAtTime(.3,t+rnd(.8,1.6),.7); nx=t+rnd(2.5,6); }; swell(); timers.push(setInterval(swell,400));
    const wb=whiteNoise(c,2);
    const crack=(t,big)=>{ const s=c.createBufferSource(); s.buffer=wb; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=big?rnd(350,900):rnd(600,2400); f.Q.value=rnd(1,2.5);
      const a=c.createGain(); const peak=big?rnd(.45,.8):rnd(.05,.22); a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(peak,t+.002); a.gain.exponentialRampToValueAtTime(.0005,t+(big?rnd(.06,.14):rnd(.01,.045))); s.connect(f); f.connect(a); a.connect(bus); s.start(t,rnd(0,1.5)); s.stop(t+.18);
      if(big){ const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(70,t+.09); const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak*.45,t+.003); g.gain.exponentialRampToValueAtTime(.0005,t+.12); o.connect(g); g.connect(bus); o.start(t); o.stop(t+.15); } };
    let next=c.currentTime+.2; const tick=()=>{ while(next<c.currentTime+.8){ crack(next,Math.random()<.07); next+=-Math.log(1-Math.random())*.22; } }; tick(); timers.push(setInterval(tick,300)); },

  /* ----- dark ambient ----- */
  abyss:({c,osc,lfo,filt,noise,bus,nodes})=>{
    const lp=filt('lowpass',190); lp.connect(bus); lfo(lp.frequency,.02,60);
    [[32.7,.55],[34.65,.45],[49,.3],[51.9,.26],[24.5,.4]].forEach(([f,a],i)=>{ const s=osc(i%2?'triangle':'sine',f,a,(Math.random()-.5)*8,lp); lfo(s.g.gain,rnd(.015,.05),a*.7); lfo(s.o.frequency,rnd(.01,.03),f*.012); });
    const rb=filt('lowpass',90), gr=gainNode(c,.9,nodes); noise('brown').connect(rb); rb.connect(gr); gr.connect(bus); lfo(gr.gain,.03,.35);
    const air=filt('bandpass',600,7), ga=gainNode(c,.035,nodes); noise('pink').connect(air); air.connect(ga); ga.connect(bus); lfo(air.frequency,.017,320); lfo(ga.gain,.022,.03); },
  cavern:({c,noise,osc,lfo,filt,bus,nodes,timers})=>{
    const rb=filt('lowpass',75), gr=gainNode(c,.6,nodes); noise('brown').connect(rb); rb.connect(gr); gr.connect(bus); lfo(gr.gain,.028,.25);
    [[320,10,.14],[190,14,.12]].forEach(([f,q,a],i)=>{ const bp=filt('bandpass',f,q), g=gainNode(c,a,nodes); noise('pink').connect(bp); bp.connect(g); g.connect(bus); lfo(bp.frequency,rnd(.03,.06),f*.35); lfo(g.gain,rnd(.04,.08),a*.7); });
    const groan=t=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(44,t); o.frequency.linearRampToValueAtTime(37,t+8); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=130;
      const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+3.5); g.gain.linearRampToValueAtTime(0,t+8); o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t+8.2); };
    let ng=c.currentTime+rnd(10,18); const tick=()=>{ const n=c.currentTime+1; if(n>=ng){ groan(ng); ng+=rnd(30,55); } }; tick(); timers.push(setInterval(tick,500)); },
  ritual:({c,osc,noise,lfo,filt,bus,nodes,timers})=>{
    const lp=filt('lowpass',150); lp.connect(bus); osc('sine',41.2,.5,0,lp); osc('sine',41.2,.35,5,lp); osc('sine',61.7,.25,-3,lp); osc('triangle',27.5,.3,0,lp); lfo(lp.frequency,.025,40);
    const src=noise('pink'); [[420,13,.05],[840,13,.04],[2400,11,.02]].forEach(([f,q,a])=>{ const bp=filt('bandpass',f,q), g=gainNode(c,a,nodes); src.connect(bp); bp.connect(g); g.connect(bus); lfo(bp.frequency,rnd(.02,.06),f*.18); lfo(g.gain,rnd(.03,.09),a*.9); });
    const wb=whiteNoise(c,1);
    const hit=(t,v)=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(41,t+.35); const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0005,t+2.2); o.connect(g); g.connect(bus); o.start(t); o.stop(t+2.4);
      const s=c.createBufferSource(); s.buffer=wb; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260; const a=c.createGain(); a.gain.setValueAtTime(v*.5,t); a.gain.exponentialRampToValueAtTime(.0005,t+.12); s.connect(f); f.connect(a); a.connect(bus); s.start(t); s.stop(t+.2); };
    let next=c.currentTime+2.5; const tick=()=>{ if(c.currentTime+1<next) return; const t=next; hit(t,.9); if(Math.random()<.45) hit(t+rnd(.55,.8),.5); next=t+rnd(7,13); }; tick(); timers.push(setInterval(tick,500)); }
};
function rainBed(c,noise,lfo,filt,bus,nodes,timers,lvl){
  const hp=filt('highpass',550), lp=filt('lowpass',6200), g=gainNode(c,.22*lvl,nodes); noise('white').connect(hp); hp.connect(lp); lp.connect(g); g.connect(bus); lfo(g.gain,.05,.04*lvl);
  const bp=filt('bandpass',360,.5), g2=gainNode(c,.35*lvl,nodes); noise('pink').connect(bp); bp.connect(g2); g2.connect(bus); lfo(g2.gain,.04,.08*lvl);
  const drop=t=>{ const o=c.createOscillator(); o.type='sine'; const f=rnd(1200,3100); o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.7,t+.03); const a=c.createGain(); a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(rnd(.012,.05)*lvl,t+.002); a.gain.exponentialRampToValueAtTime(.0005,t+rnd(.02,.07)); o.connect(a); a.connect(bus); o.start(t); o.stop(t+.1); };
  let next=c.currentTime+.1; const tick=()=>{ while(next<c.currentTime+.8){ drop(next); next+=rnd(.03,.2)/Math.max(.4,lvl); } }; tick(); timers.push(setInterval(tick,300));
}

function startDrone(id,preview){
  stopDrone(.3); clearTimeout(droneTimer); if(!id||id==='off'||!DPRE[id]) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const c=AC, t0=c.currentTime;
    const nodes=[], srcs=[], timers=[]; const rv=DREV[id]||{sec:4,wet:.55,dry:.75};
    const master=c.createGain(); master.gain.setValueAtTime(0,t0); master.gain.linearRampToValueAtTime(droneVol()*.9,t0+5); master.connect(c.destination); nodes.push(master);
    const comp=c.createDynamicsCompressor(); comp.connect(master); nodes.push(comp);
    const dry=c.createGain(); dry.gain.value=rv.dry; dry.connect(comp);
    const conv=c.createConvolver(); conv.buffer=reverbIR(c,rv.sec); const wet=c.createGain(); wet.gain.value=rv.wet; conv.connect(wet); wet.connect(comp);
    const bus=c.createGain(); bus.gain.value=.42*(DTRIM[id]||1); bus.connect(dry); bus.connect(conv); nodes.push(dry,conv,wet,bus);
    const osc=(type,f,gain,det,dest)=>{ const o=c.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=det||0; const g=c.createGain(); g.gain.value=gain; o.connect(g); g.connect(dest||bus); o.start(); srcs.push(o); nodes.push(g); return {o,g}; };
    const lfo=(param,rate,depth)=>{ const o=c.createOscillator(); o.frequency.value=rate; const g=c.createGain(); g.gain.value=depth; o.connect(g); g.connect(param); o.start(); srcs.push(o); nodes.push(g); };
    const filt=(type,f,q)=>{ const b=c.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q||.7; nodes.push(b); return b; };
    const bufs={}; const noise=kind=>{ const s=c.createBufferSource(); s.buffer=bufs[kind]||(bufs[kind]=kind==='white'?whiteNoise(c,6):kind==='pink'?pinkNoise(c,6):brownNoise(c,6)); s.loop=true; s.start(); srcs.push(s); return s; };
    DR={id,c,master,nodes,srcs,timers,preview:!!preview};
    DPRE[id]({c,bus,osc,lfo,filt,noise,nodes,srcs,timers});
    if(preview) droneTimer=setTimeout(()=>{ if(DR&&DR.preview){ stopDrone(2); if(view==='mind') render(); } },90000);
  }catch(e){ if(DR) stopDrone(.1); DR=null; }
}
function setDroneVol(){ if(DR){ const t=DR.c.currentTime; DR.master.gain.cancelScheduledValues(t); DR.master.gain.setTargetAtTime(droneVol()*.9,t,.25); } }
function stopDrone(fade){ const d=DR; if(!d) return; DR=null; clearTimeout(droneTimer); if(fade==null) fade=3; d.timers.forEach(clearInterval);
  const t=d.c.currentTime; try{ d.master.gain.cancelScheduledValues(t); d.master.gain.setValueAtTime(d.master.gain.value,t); d.master.gain.linearRampToValueAtTime(0,t+fade); }catch(e){}
  setTimeout(()=>{ d.srcs.forEach(o=>{try{o.stop();}catch(e){}}); d.nodes.forEach(n=>{try{n.disconnect();}catch(e){}}); },fade*1000+300); }
const droneName=id=>(DRONES.find(d=>d.id===id)||{name:'No drone'}).name;

/* picker used on the meditation start screen */
function dronePills(){ const cur=dronePick();
  return `<button class="pill ${cur==='off'?'on':''}" data-act="dronepick" data-id="off">None</button>`+DGROUPS.map(([g,label])=>`<div class="dgrp"><span class="lbl">${label}</span><div class="pill-row">${DRONES.filter(d=>d.g===g).map(d=>`<button class="pill ${cur===d.id?'on':''}" data-act="dronepick" data-id="${d.id}">${d.name}</button>`).join('')}</div></div>`).join(''); }
const droneSlider=()=>`<div class="row" style="gap:10px;justify-content:center;margin-top:10px"><span class="note">Volume</span><input type="range" id="dronevol" min="0" max="100" value="${Math.round(droneVol()*100)}" style="width:160px"></div>`;

/* panel on the Mind page */
function dronePanel(){ const cur=dronePick();
  const row=d=>{ const on=DR&&DR.id===d.id&&DR.preview; return `<div class="li" style="flex-wrap:wrap"><div class="grow" style="min-width:200px"><div class="t">${d.name}${cur===d.id?' <span class="chip b">Selected</span>':''}</div><div class="s">${d.desc}</div></div>
     <div class="row" style="gap:6px"><button class="btn sm ${on?'pri':''}" data-act="dronepreview" data-id="${d.id}">${on?'Stop':'Listen'}</button><button class="btn sm ${cur===d.id?'pri':'ghost'}" data-act="droneuse" data-id="${d.id}">${cur===d.id?'In use':'Use'}</button></div></div>`; };
  return panel('Meditation sounds','',`<p class="mut">Generated sound to sit with. Pick one and it plays during any guided meditation. Everything is created on your device, so it works offline.</p>
   ${DGROUPS.map(([g,label])=>`<div class="lbl" style="margin:22px 0 4px">${label}</div><div class="list">${DRONES.filter(d=>d.g===g).map(row).join('')}</div>`).join('')}
   <div class="list mt16"><div class="li"><div class="grow"><div class="t">No sound</div><div class="s">Silence apart from the start and end bell.</div></div><button class="btn sm ${cur==='off'?'pri':'ghost'}" data-act="droneuse" data-id="off">${cur==='off'?'In use':'Use'}</button></div></div>${droneSlider()}
   <p class="note mt12" style="font-size:12.5px">The dark ambient sounds contain very low bass. Headphones or a speaker with real low end will reveal it. Small phone speakers will mostly play only the upper textures.</p>`);
}

function vToday(){
  const k=TODAY(), d=G(k), pl=dayPlan(k), T=targets(), ft=foodTotals(k), ph=phaseInfo(), lv=levelInfo(), hr=new Date().getHours();
  const stretchId = pl.energy===1?'mini':hr>=19?'wind':pl.energy===2?'desk':'backhip';
  const medId = pl.energy===1?'settle':hr>=16?'offload':'bodyscan5';
  const nr=nextRoutine();
  let checkin='';
  if(!d.energy){
    checkin=`<div class="c12">${panel('How is your energy right now?','',`<p class="mut" style="margin-bottom:16px">Today's plan scales to match. There is no wrong answer.</p>
      <div class="choice" style="grid-template-columns:repeat(3,1fr)">${ENERGY.map(e=>`<button class="opt" data-act="energy" data-v="${e.id}">${ico(e.icon)}<b>${e.name}</b><small>${e.sub}</small></button>`).join('')}</div>`)}</div>`;

/* ---------- PROGRESS ---------- */
function insights(){
  const out=[]; const keys=Object.keys(S.days).sort(); const T=targets();
  const urges=[]; keys.forEach(k=>(S.days[k].urges||[]).forEach(u=>urges.push({k,...u})));
  if(urges.length>=4){
    const b={m:0,a:0,e:0,l:0}; urges.forEach(u=>{const h=new Date(u.t).getHours(); h<12?b.m++:h<16?b.a++:h<21?b.e++:b.l++;});
    const top=Object.entries(b).sort((x,y)=>y[1]-x[1])[0]; const nm={m:'morning',a:'midday to afternoon',e:'evening (4-9pm)',l:'late night'}[top[0]];
    out.push(['Urge timing',`Most of your urges (${top[1]} of ${urges.length}) hit in the ${nm}. Plan your decompression and a protein option right before that window.`]);
    const tc={}; urges.forEach(u=>{if(u.trigger) tc[u.trigger]=(tc[u.trigger]||0)+1;}); const tt=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
    if(tt) out.push(['Top trigger',`"${tt[0]}" is your most common trigger (${tt[1]}). Prepare a specific response for it.`]);
  } else out.push(['Urge patterns','Log 4 or more urges with the interrupter and your timing and trigger patterns appear here.']);
  const sl=[], sg=[]; keys.forEach(k=>{const d=S.days[k]; if(d.sleepH&&foodTotals(addDays(k,0)).n>=2){ (d.sleepH<6.5?sl:sg).push(foodTotals(k).kcal); }});
  if(sl.length>=3&&sg.length>=3){ const a=sl.reduce((x,y)=>x+y)/sl.length, b=sg.reduce((x,y)=>x+y)/sg.length; out.push(['Sleep and eating',`On days with under 6.5 hours of sleep you ate about ${Math.round(a)} kcal vs ${Math.round(b)} on better-sleep days (${a>b?'+':''}${Math.round(a-b)}).`]); }
  else out.push(['Sleep and eating','Log sleep and food for a few more days to compare short-sleep days with good ones.']);
  const lo=[], hi=[]; keys.forEach(k=>{const d=S.days[k]; if(d.energy&&foodTotals(k).n>=2){ (d.energy===1?lo:hi).push(foodTotals(k).kcal);} });
  if(lo.length>=3&&hi.length>=3){ const a=lo.reduce((x,y)=>x+y)/lo.length, b=hi.reduce((x,y)=>x+y)/hi.length; out.push(['Energy and eating',`Low-energy days average ${Math.round(a)} kcal vs ${Math.round(b)} otherwise. ${a>b+150?'Low energy leads to more eating, so keep ready-to-eat protein on hand.':'No big difference, which is a good sign.'}`]); }
  const rate=recentRate(); const t=trendSeries();
  const logged=keys.filter(k=>k>=addDays(TODAY(),-21)&&foodTotals(k).n>=2);
  if(rate!=null&&logged.length>=10){ const avg=logged.reduce((a,k)=>a+foodTotals(k).kcal,0)/logged.length; const obs=Math.round(avg+rate*500); out.push(['Observed burn',`Eating about ${Math.round(avg)} kcal and losing ${r1(rate)} lb/week implies your real daily burn is near ${obs} kcal (the app assumes ${T.tdee}).`+(Math.abs(obs-T.tdee)>150?` <button class="btn sm" data-act="adopt" data-v="${obs}">Adopt ${obs}</button>`:'')]); }
  else out.push(['Observed burn','After about 3 weeks of weigh-ins and 10 logged food days, HealthForge estimates your real calorie burn from your own data.']);
  return out;
}
function goalPanel(){

  const series=[{name:'Plan',color:'#9381ff',pts:[{x:g.n0,y:p.startWeight},{x:g.n1,y:p.goalWeight}],dash:true,width:2},{name:'Actual',color:'#3b9cff',pts:tr.map(x=>({x:x.n,y:x.t,w:x.w})),area:true,main:true,last:true,width:2.6}];
  if(g.rate&&g.rate>0.1&&g.status!=='done'&&g.daysLeft>0){ const pn=g.projDate?Math.min(g.n1,dayNum(g.projDate)):g.n1; series.push({name:'Projection',color:'#22d3ee',pts:[{x:g.nt,y:g.w},{x:pn,y:Math.max(p.goalWeight-3,g.w-g.rate*(pn-g.nt)/7)}],dash:true,width:2}); }

  const p1Done=hasP1&&g.w<=p1, p1Late=hasP1&&!p1Done&&g.nt>p1n;
  const refs=[{y:p.goalWeight,label:'Goal '+p.goalWeight,color:'#38d9a0'}]; if(hasP1) refs.push({y:p1,label:'Phase 1: '+r1(p1),color:'#f6b94c'});

  const diffTxt=g.status==='done'?'':(Math.abs(g.diff)<0.05?'on the plan line':r1(Math.abs(g.diff))+' lb '+(g.diff>0?'above':'below')+' the plan line');

function vProgress(){
  const p=S.profile, ph=phaseInfo(), T=TODAY(); const tr=trendSeries(); const c=counts();
  const lim=progRange? dayNum(T)-progRange : -1e9;

  const refs=[]; if(raw.length){ const mn=Math.min(...raw.map(x=>x.w)); if(ph.p1<mn&&mn-ph.p1<30||ph.toP1>0&&ph.p1>=mn-15) refs.push({y:ph.p1,label:'Phase 1: '+r1(ph.p1),color:'#9381ff'}); if(ph.goal>=mn-40&&Math.abs(ph.goal-ph.p1)>6) refs.push({y:ph.goal,label:'Goal '+ph.goal,color:'#38d9a0'}); }
  const wchart= tr.length>=2? chartBox('wchart',{series:[{name:'Scale',color:'#8c9bb3',pts:raw.map(x=>({x:x.n,y:x.w})),line:false,dots:true,dotOp:.55},{name:'Trend',color:'#3b9cff',pts:raw.map(x=>({x:x.n,y:x.t,w:x.w})),area:true,main:true,last:true,width:2.6}],refs,yfmt:v=>Math.round(v),tipfn:b=>`<span class="k">${fmtD(fromNum(b.x))}</span><br>Trend <b>${r1(b.y)}</b> lb<br>Scale <b>${b.w}</b> lb`},260)
    +`<div class="legend"><span><i style="background:#3b9cff"></i>Trend (smoothed)</span><span><i style="background:#8c9bb3"></i>Scale reading</span></div>`
    : `<div class="empty">${emptyArt('chart')}<div>Log your weight on 2 or more days to see your trend line.</div><button class="btn sm pri" data-act="log" data-kind="weight">${ico('scale')} Log weight</button></div>`;
  const ser=(f,color,tf)=>{ const pts=Object.keys(S.days).sort().filter(k=>S.days[k][f]>0&&dayNum(k)>=Math.max(lim,dayNum(T)-120)).map(k=>({x:dayNum(k),y:S.days[k][f]})); return pts.length>1? chartBox('c_'+f,{series:[{color,pts,area:true,main:true,dots:true,dotOp:.8,last:true}],tipfn:b=>`<span class="k">${fmtD(fromNum(b.x))}</span> <b>${r1(b.y)}</b>`},150):`<div class="empty" style="padding:14px"><div>Needs 2 or more entries</div></div>`; };
  const bpPts=Object.keys(S.days).sort().filter(k=>S.days[k].bpS).slice(-30).map(k=>({x:dayNum(k),y:S.days[k].bpS,d:S.days[k].bpD}));
  const lastBP=bpPts.length? bpPts[bpPts.length-1]:null;
  const bpNote= lastBP? (lastBP.y>=180||lastBP.d>=120?'<span class="badc">Very high reading. Seek medical care if this repeats or you have symptoms.</span>': lastBP.y>=140||lastBP.d>=90?'<span class="warnc">Above 140/90. Worth mentioning to your doctor.</span>':lastBP.y>=130||lastBP.d>=80?'<span class="warnc">Slightly elevated. Weight loss and walking help.</span>':'<span class="up">Within a healthy range.</span>'):'';
  const badges=BADGES.map(b=>{const on=b.test(c);return `<div class="badge ${on?'':'off'}">${medal(b.g,!on)}<span>${b.n}</span></div>`;}).join('');
  const road=[['Phase 1',r1(ph.p1)+' lb','First 20 lb',ph.phase>1?1:ph.pct1,ph.p1Date],['Phase 2',ph.goal+' lb','To goal weight',ph.phase>2?1:(ph.phase===2?ph.pctG:0),ph.goalDate],['Maintain','+/- 3 lb','Hold it for good',ph.phase===3?1:0,null]];
  return `<div class="grid">
    <div class="c12"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 20px">
      ${[['Trend weight',r1(ph.w),'lb',null],['Trend change',(ph.lost>=0?'-':'+')+r1(Math.abs(ph.lost)),'lb',null],['Weekly rate',rate!=null?r1(rate):'--','lb/wk',null],['To phase 1',r1(ph.toP1),'lb',null],['To goal',r1(ph.toGoal),'lb',null]].map(s=>`<div><div class="stat"><div class="lbl">${s[0]}</div><div class="v">${s[1]}<small>${s[2]}</small></div></div></div>`).join('')}</div></div>
    <div class="c12">${goalPanel()}</div>
    <div class="c12">${panel('Weight trend','scale',`<div class="row between wrap" style="margin-bottom:10px"><div class="seg">${[[30,'30d'],[90,'90d'],[180,'6m'],[0,'All']].map(o=>`<button class="${progRange===o[0]?'on':''}" data-act="range" data-v="${o[0]}">${o[1]}</button>`).join('')}</div><button class="btn sm pri" data-act="log" data-kind="weight">${ico('plus')} Weigh-in</button></div>${wchart}<p class="note mt8">The blue line smooths daily water swings. Judge progress by the trend, not by single scale readings.</p>`)}</div>
    <div class="c12">${panel('Roadmap','flag',`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${road.map(r=>`<div><div class="row between"><b>${r[0]}</b><span class="mono mut">${r[1]}</span></div><div class="bar" style="height:8px"><i style="width:${Math.round(r[3]*100)}%"></i></div><div class="note mt8">${r[2]}${r[4]&&r[3]<1?' &middot; ETA '+fmtD(r[4]):r[3]>=1?' &middot; done':''}</div></div>`).join('')}</div>
      ${ph.phase===3||ph.toGoal<1?`<div class="banner mt16">${ico('info').replace('<svg','<svg width="20" height="20"')}<div>You are at your goal range. ${S.settings.mode==='maintain'?'Maintenance mode is on: calories are set to your burn. If your trend rises more than 3 lb above goal, return to a small deficit for two weeks.':'Switch to maintenance in Settings to raise calories to your burn gradually.'}</div></div>`:''}`)}</div>
    <div class="c6 t6">${panel('Waist','ruler',ser('waist','#22d3ee')+`<div class="row between mt8"><span class="note">${(()=>{const w=Object.keys(S.days).filter(k=>S.days[k].waist>0).sort();return w.length?S.days[w[w.length-1]].waist+' in latest':'Not logged';})()}</span><button class="btn sm" data-act="log" data-kind="waist">${ico('plus')} Log</button></div>`)}</div>

    <div class="c6 t6">${panel('Blood pressure and pulse','pulse',(bpPts.length>1? chartBox('bpc',{series:[{color:'#ff6d7e',pts:bpPts.map(b=>({x:b.x,y:b.y,d:b.d})),main:true,dots:true,dotOp:.9,last:true}],refs:[{y:130,label:'130',color:'#f6b94c'}],tipfn:b=>`<span class="k">${fmtD(fromNum(b.x))}</span> <b>${b.y}/${b.d}</b>`},150):`<div class="empty" style="padding:14px"><div>Needs 2 or more readings</div></div>`)+`<div class="row between mt8"><span class="note">${bpNote||'Systolic shown'}</span><button class="btn sm" data-act="log" data-kind="bp">${ico('plus')} Log</button></div>`)}</div>

  </div>`;
}

function copyText(txt,msg){ (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg),()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast(msg);}catch(e){toast('Copy failed');} ta.remove(); }); }
function downloadFile(name,txt,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ---------- workout generator ---------- */
function genWorkout(){
  const pick=a=>a[Math.floor(Math.random()*a.length)]; const out=[];
  const pool=cat=>Object.values(EXERCISES).filter(x=>x.cat===cat&&!x.j.some(v=>v>=3));
  const energy=energyOf(TODAY())||2; const cats=energy===1?['Legs','Push','Core']:['Legs','Glutes and hinge','Push','Pull','Core'];
  cats.forEach(c=>{ const p=pool(c); if(p.length) out.push(pick(p).id); });
  return out;
}

/* ---------- AI summary ---------- */
function buildSummary(n){
  const p=S.profile, T=targets(), ph=phaseInfo(); const end=TODAY(), start=addDays(end,-(n-1)); const rate=recentRate();
  let m=`# HealthForge summary (${fmtD(start)} to ${fmtD(end)})\n\n## Profile\n- Male, age ${ageNow()}, height ${p.heightIn} in, start weight ${p.startWeight} lb (${p.startDate}), goal ${p.goalWeight} lb, pace ${p.pace} lb/week\n- Trend weight now: ${r1(ph.w)} lb (change ${r1(-ph.lost)} lb since start), recent rate ${rate!=null?r1(rate)+' lb/week':'n/a'}\n- Targets: ${T.kcal} kcal, ${T.protein} g protein (estimated burn ${T.tdee} kcal, mode ${S.settings.mode})\n- Context: stress eating mostly in the evening; introvert in a new management role; insulin resistance; avoids red meat, most eggs, leafy salads; knee, back, hip and shoulder stiffness\n\n## Daily log\n| Date | Wt | Energy | Mood | Kcal | Protein | Walk min | Strength | Stretch min | Med min | Sleep h | Urges |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n`;
  for(let i=0;i<n;i++){ const k=addDays(start,i), d=G(k), ft=foodTotals(k); m+=`| ${k} | ${d.weight||''} | ${d.energy||''} | ${d.mood||''} | ${ft.n?Math.round(ft.kcal):''} | ${ft.n?Math.round(ft.protein):''} | ${walkMin(k)||''} | ${strengthN(k)||''} | ${stretchMin(k)||''} | ${medMin(k)||''} | ${d.sleepH||''} | ${(d.urges||[]).length||''} |\n`; }
  const urges=[]; for(let i=0;i<n;i++){ const k=addDays(start,i); (G(k).urges||[]).forEach(u=>urges.push({k,...u})); }
  m+=`\n## Urge events (${urges.length})\n`+(urges.length? urges.map(u=>`- ${u.k} ${new Date(u.t).toTimeString().slice(0,5)}: ${u.src||'?'} / ${u.trigger||'no trigger'} / outcome ${u.outcome||'?'}${u.note?' / '+u.note:''}`).join('\n'):'None logged.');
  const rec=[]; for(let i=0;i<n;i++){ const k=addDays(start,i); (G(k).recovery||[]).forEach(r=>rec.push({k,...r})); }
  m+=`\n\n## Manager recovery log\n`+(rec.length? rec.map(r=>`- ${r.k}: ${r.what}, drain ${r.lvl}/5, recharge ${r.rc}${r.note?' ('+r.note+')':''}`).join('\n'):'None logged.');
  const meas=Object.keys(S.days).filter(k=>S.days[k].waist||S.days[k].bpS).sort().slice(-8);
  m+=`\n\n## Measurements and vitals\n`+(meas.length?meas.map(k=>`- ${k}: ${S.days[k].waist?'waist '+S.days[k].waist+' in; ':''}${S.days[k].bpS?'BP '+S.days[k].bpS+'/'+S.days[k].bpD+'; ':''}${S.days[k].rhr?'RHR '+S.days[k].rhr:''}`).join('\n'):'None.');
  m+=`\n\n## Prompt\nYou are my supportive, matter-of-fact health coach. Using the data above: 1) summarize what is working and what is not, 2) identify my top three stress-eating patterns and what triggers them, 3) check whether my calorie and protein targets still fit my actual weight trend, 4) suggest three small, low-effort changes for the next two weeks that fit an introvert with limited mental energy, 5) flag anything that should be discussed with a doctor. No guilt, keep it concise.\n`;
  return m;
}

/* ---------- demo data ---------- */
function loadDemo(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const startK=addDays(TODAY(),-69); const T0=defaults();
  T0.profile={name:'Demo',dob:'1979-12-15',heightIn:73,startWeight:265,startDate:startK,goalWeight:220,pace:1.5,activity:1.35,kcalOverride:0,proteinOverride:0,tdeeOverride:0};
  S=T0; S.meta.created=Date.now();
  for(let i=0;i<70;i++){ const k=addDays(startK,i), dow=pd(k).getDay(); if(rnd()<.12) continue; const d=D(k);
    d.energy=rnd()<.25?1:rnd()<.65?2:3; d.mood=Math.max(1,Math.min(5,Math.round(2+d.energy*.8+rnd()*1.4-.5)));
    if(rnd()<.8) d.weight=r1(265-i*.17+(rnd()-.5)*3);
    d.sleepH=r1(5.5+rnd()*2.5); d.water=Math.floor(4+rnd()*5);
    const kc=Math.round(1900+rnd()*500+(d.sleepH<6.5?250:0)); d.food=[{id:uid(),name:'Breakfast',kcal:Math.round(kc*.2),protein:30,meal:'b',t:0},{id:uid(),name:'Lunch',kcal:Math.round(kc*.3),protein:42,meal:'l',t:0},{id:uid(),name:'Dinner',kcal:Math.round(kc*.35),protein:48,meal:'d',t:0},{id:uid(),name:'Snack',kcal:Math.round(kc*.15),protein:20,meal:'s',t:0}];
    d.walk=rnd()<.8?[{min:Math.round(10+rnd()*30),speed:2.5,t:0}]:[]; if([1,3,5].includes(dow)&&rnd()<.8) d.strength=[{r:'ABC'[Math.floor(rnd()*3)],mini:false,min:18,rpe:3,t:0}];
    if(rnd()<.6) d.stretch=[{id:'desk',min:4,t:0}]; if(rnd()<.5) d.meditate=[{id:'settle',min:3,t:0}];
    if(rnd()<.35){ d.urges=[{t:new Date(2026,0,1,16+Math.floor(rnd()*5),Math.floor(rnd()*60)).getTime(),src:'stress',trigger:TRIGGERS[Math.floor(rnd()*4)],outcome:rnd()<.6?'handled':rnd()<.5?'planned':'ate'}]; }
    if(rnd()<.2) d.recovery=[{what:DRAINERS[Math.floor(rnd()*5)],lvl:2+Math.floor(rnd()*4),rc:RECHARGE[Math.floor(rnd()*4)],note:'',t:0}];
    if(i%7===0) d.waist=r1(44-i*.04); if(i%9===0){ d.bpS=Math.round(138-i*.1+rnd()*6); d.bpD=Math.round(88-i*.05+rnd()*4); d.rhr=Math.round(74-i*.05+rnd()*4); }
  }
  saveNow(); lastXP=totalXP();
}

function importFile(file,done){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j||typeof j!=='object'||!j.days||!j.profile) throw 0; S=Object.assign(defaults(),j); S.settings=Object.assign(defaults().settings,j.settings||{}); saveNow(); lastXP=totalXP(); toast('Backup restored'); done&&done(); go('today'); }catch(e){ toast('That file is not a valid backup'); } }; r.readAsText(file); }

const MCOL={p:'#9381ff',c:'#3b9cff',f:'#f6b94c'};
const ICOL=['#22d3ee','#3b9cff','#9381ff','#f6b94c','#38d9a0','#ff8fb1'];
function macroSplit(t){ const pk=t.p*4, ck=t.c*4, fk=t.f*9, tot=pk+ck+fk; return {pk,ck,fk,tot,pp:tot?pk/tot:0,cp:tot?ck/tot:0,fp:tot?fk/tot:0}; }
function donut(m,size,center,sub){
  const r=(size-16)/2, c=2*Math.PI*r; let off=0; const seg=[[m.pp,MCOL.p],[m.cp,MCOL.c],[m.fp,MCOL.f]];
  let arcs=''; seg.forEach(([v,col])=>{ if(v>0.001){ const len=Math.max(0,v*c-2); arcs+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`; } off+=v*c; });
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(125,160,215,.14)" stroke-width="14"/>${arcs}</svg><div class="ctr"><div class="mono" style="font-size:20px;font-weight:600">${center}</div><div class="lbl" style="margin-top:1px">${sub}</div></div></div>`;
}
function macroBar(m,h=8){ return `<div style="display:flex;gap:2px;height:${h}px;border-radius:${h}px;overflow:hidden;background:rgba(125,160,215,.14)">${[[m.pp,MCOL.p],[m.cp,MCOL.c],[m.fp,MCOL.f]].map(([v,c])=>v>0?`<i style="width:${(v*100).toFixed(1)}%;background:${c}"></i>`:'').join('')}</div>`; }
// Macro breakdown for a day's totals (used under the fuel gauges)
function macroBreak(ft){
  const t={p:ft.protein,c:ft.carbs,f:ft.fat}, m=macroSplit(t), none=ft.nomac===ft.n;
  if(!ft.n) return '';
  const rows=[['Protein',t.p,m.pp,MCOL.p],['Carbs',t.c,m.cp,MCOL.c],['Fat',t.f,m.fp,MCOL.f]];
  return `<div class="mt16"><div class="lbl" style="margin-bottom:6px">Macros</div>${m.tot&&!none?macroBar(m,10):`<div class="note">No carb or fat data logged yet. Foods logged from the ingredient list or a built meal include it.</div>`}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">${rows.map(([l,g,pc,c])=>`<div><div class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${c};margin-right:6px"></i>${l}</div><div class="mono" style="font-size:16px;margin-top:2px">${none&&l!=='Protein'?'-':Math.round(g)+' g'}</div><div class="s mut">${m.tot&&!none?Math.round(pc*100)+'% of kcal':'-'}</div></div>`).join('')}</div>
    ${ft.nomac&&!none?`<div class="note" style="margin-top:8px">${ft.nomac} logged ${ft.nomac===1?'food has':'foods have'} calories and protein only, so carbs and fat are undercounted.</div>`:''}</div>`;
}
function paintTot(){
  const t=itemTot(B), m=macroSplit(t);
  if(!B.items.length||!m.tot){ $('#btot').innerHTML=''; return; }
  const rows=[['Protein',t.p,m.pp,MCOL.p],['Carbs',t.c,m.cp,MCOL.c],['Fat',t.f,m.fp,MCOL.f]];
  // calorie contribution by ingredient
  const parts=B.items.map((i,n)=>({n:i.n,k:i.q*i.k})).filter(x=>x.k>0).sort((a,b)=>b.k-a.k); const tk=parts.reduce((a,x)=>a+x.k,0)||1;
  const top=parts.slice(0,5), rest=parts.slice(5).reduce((a,x)=>a+x.k,0); const segs=top.map((x,i)=>({...x,c:ICOL[i]})); if(rest>0) segs.push({n:'Everything else',k:rest,c:'#5d6c85'});
  $('#btot').innerHTML=`<div class="box" style="margin-top:10px"><div class="row gap16 wrap" style="align-items:center">
    ${donut(m,128,Math.round(t.k),'kcal')}
    <div class="grow" style="min-width:190px">${rows.map(([l,g,pc,c])=>`<div style="margin-bottom:9px"><div class="row between"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:7px"></i>${l}</span><span class="mono">${r1(g)} g <span class="mut">&middot; ${Math.round(pc*100)}%</span></span></div><div class="bar" style="height:5px;margin-top:4px"><i style="width:${Math.round(pc*100)}%;background:${c}"></i></div></div>`).join('')}</div></div>
    <div class="note" style="margin-top:2px">Percent of calories from each macro (protein and carbs 4 kcal per g, fat 9). Protein per 100 kcal: <b class="mono">${r1(t.p/(t.k||1)*100)} g</b></div>
    <div class="lbl" style="margin-top:12px">Where the calories come from</div>
    <div style="display:flex;gap:2px;height:12px;border-radius:12px;overflow:hidden;margin-top:6px;background:rgba(125,160,215,.14)">${segs.map(x=>`<i title="${esc(x.n)}" style="width:${(x.k/tk*100).toFixed(1)}%;background:${x.c}"></i>`).join('')}</div>
    <div class="legend" style="margin-top:8px">${segs.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n.length>26?x.n.slice(0,25)+'...':x.n)} <span class="mono">${Math.round(x.k/tk*100)}%</span></span>`).join('')}</div></div>`;
}
function paintBtns(){ $('#bbtns').innerHTML=`<button class="btn pri" data-act="bsave">Save meal</button><button class="btn" data-act="bsave" data-log="1">Save and log it</button>${B.id?`<button class="btn danger" data-act="mmdel" data-id="${B.id}" data-close="1">${ico('trash')} Delete</button>`:''}`; }

function addLine(x){ const ex=B.items.find(i=>i.n===x.n&&i.u===x.u); if(ex) ex.q+=1; else B.items.push({n:x.n,u:x.u,q:1,k:x.k,p:x.p,c:x.c,f:x.f,a:x.a||'Other'}); paintLines(); }

function myMealPills(){ return S.myMeals.length?`<div class="lbl mt16">My meals (tap to log)</div><div class="pill-row mt8">${S.myMeals.map(m=>`<button class="pill" data-act="mmlog" data-id="${m.id}">${esc(m.name)} <span class="mono dim">${Math.round(itemTot(m).k)}</span></button>`).join('')}</div>`:''; }
function planItems(){

};

const gPick=(arr,w)=>{ const ws=arr.map(w), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot; for(let i=0;i<arr.length;i++){ r-=ws[i]; if(r<=0) return arr[i]; } return arr[arr.length-1]; };

function genBuild(){
  const isS=GEN.kind==='s', lib=Object.values(isS?EXERCISES:STRETCHES), recent=new Set(S.meta.recentEx||[]);
  const energy=energyOf(TODAY())||2; const pat=gFocus()[2]; const notes=[]; let avoided=0;
  const items=[]; const used=new Set(); const j2=[0,0,0]; const eqSeen={};
  const usable=x=>x.eq.some(e=>GEN.eq.includes(e));
  const cand=cat=>lib.filter(x=>(x.cat||x.area)===cat&&!used.has(x.id)&&usable(x)&&(!isS||(GEN.care?!x.j.some(v=>v>=3)&&!x.j.some((v,i)=>v===2&&j2[i]>=2):true)));
  const sets=energy===1?2:3;
  let n, budget=0;
  if(isS) n=clamp(Math.round(GEN.min*60/(sets*(40+S.settings.restSec))),3,9); else n=30;
  const target=GEN.min*60; let t=0, guard=0;
  while(items.length<n&&guard++<60){
    const cat=pat[items.length%pat.length]; let pool=cand(cat);
    if(!pool.length) pool=lib.filter(x=>!used.has(x.id)&&usable(x)&&(!isS||!GEN.care||(!x.j.some(v=>v>=3)&&!x.j.some((v,i)=>v===2&&j2[i]>=2))));
    if(!pool.length) break;
    const x=gPick(pool,c=>{ let w=1; if(recent.has(c.id)){ w*=.2; } if(isS&&c.eq.every(e=>eqSeen[e])) w*=.7; return w; });
    if(recent.has(x.id)) avoided--; used.add(x.id); x.eq.forEach(e=>{ if(GEN.eq.includes(e)) eqSeen[e]=1; });
    if(isS){ x.j.forEach((v,i)=>{ if(v===2) j2[i]++; }); items.push([x.id,energy===1?Math.min(2,x.sets):x.sets,x.reps]); }
    else { const sec=x.sec; if(items.length>=3&&t+sec>target+10) break; t+=sec; items.push([x.id,sec]); if(t>=target-10) break; }
  }
  const ord=isS?CATS:AREAS; items.sort((a,b)=>{ const A=(isS?EXERCISES:STRETCHES)[a[0]], B=(isS?EXERCISES:STRETCHES)[b[0]]; return ord.indexOf(A.cat||A.area)-ord.indexOf(B.cat||B.area); });
  // reasons shown to the user
  notes.push(gFocus()[1]+', about '+routineMin({kind:GEN.kind,items})+' min');
  if(isS){ const cs=[...new Set(items.map(i=>EXERCISES[i[0]].cat))]; notes.push('Covers '+cs.length+' movement groups: '+cs.map(c=>c.toLowerCase()).join(', ')); if(GEN.care) notes.push('Skipped moves with a joint caution, and kept moves needing extra care to two per joint'); if(energy===1) notes.push('Lighter volume (2 sets) because you logged a low-energy day'); }
  else { const as=[...new Set(items.map(i=>STRETCHES[i[0]].area))]; notes.push('Targets '+as.map(c=>c.toLowerCase()).join(', ')); }

}

async function fetchJson(url,tries){
  tries=tries||3;
  for(let i=0;i<tries;i++){
    try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),12000); const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
      if(r.ok) return await r.json(); if(r.status===429||r.status>=500) throw new Error('busy'); throw new Error('http '+r.status); }
    catch(e){ if(i===tries-1) throw e; await wsleep(900*(i+1)); }
  }
}
function webItem(src,code,name,brand,u,k,p,c,f,per){
  const nm=brand&&!name.toLowerCase().includes(brand.toLowerCase().split(',')[0].trim())?(tcase(brand.split(',')[0])+' '+name):name;
  return {src,code,n:nm.trim(),brand:brand||'',u,k:Math.round(k||0),p:fixed(p,1),c:fixed(c,1),f:fixed(f,1),per,a:'Other',cat:'My ingredients',
    note:'From '+(src==='off'?'Open Food Facts':'USDA FoodData Central')+(code?' (code '+code+')':'')+'. Check against the package.'};
}
function offNormalize(p){
  const nu=p.nutriments||{}; let kc=nu['energy-kcal_100g']; if(kc==null&&nu['energy_100g']!=null) kc=nu['energy_100g']/4.184;
  if(!p.product_name||kc==null) return null;
  const sq=parseFloat(p.serving_quantity); const hasS=isFinite(sq)&&sq>0; const fct=hasS?sq/100:1;
  return webItem('off',p.code,p.product_name,(p.brands||''),hasS?(p.serving_size||sq+' g'):'100 g',kc*fct,(nu.proteins_100g||0)*fct,(nu.carbohydrates_100g||0)*fct,(nu.fat_100g||0)*fct,hasS?'serving':'100 g');
}
function usdaNormalize(f){
  const g=id=>{ const n=(f.foodNutrients||[]).find(x=>x.nutrientId===id); return n?n.value:null; };
  let kc=g(1008); if(kc==null){ const k2=g(2047)!=null?g(2047):g(2048); kc=k2; } if(kc==null) return null;
  const unit=String(f.servingSizeUnit||'').toLowerCase(); const ss=parseFloat(f.servingSize);
  const hasS=f.dataType==='Branded'&&isFinite(ss)&&ss>0&&(unit==='g'||unit==='grm'||unit==='ml'||unit==='mlt'); const fct=hasS?ss/100:1;
  const label=hasS?((f.householdServingFullText?f.householdServingFullText+' (':'')+Math.round(ss*10)/10+(unit.startsWith('m')?' ml':' g')+(f.householdServingFullText?')':'')):'100 g';
  return webItem('usda',f.gtinUpc||f.fdcId,tcase(f.description),tcase(f.brandName||f.brandOwner||''),label,kc*fct,(g(1003)||0)*fct,(g(1005)||0)*fct,(g(1004)||0)*fct,hasS?'serving':'100 g');

async function searchOff(q){ const j=await fetchJson('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=10&fields=code,product_name,brands,serving_size,serving_quantity,nutriments'); return (j.products||[]).map(offNormalize).filter(Boolean); }
async function searchUsda(q){ const j=await fetchJson('https://api.nal.usda.gov/fdc/v1/foods/search?query='+encodeURIComponent(q)+'&pageSize=25&dataType=Branded,Foundation,SR%20Legacy&api_key='+encodeURIComponent(usdaKey()));
  const all=(j.foods||[]).map(f=>({it:usdaNormalize(f),gen:f.dataType!=='Branded'})).filter(x=>x.it); return [...all.filter(x=>x.gen).slice(0,5),...all.filter(x=>!x.gen)].slice(0,10).map(x=>x.it); }
async function lookupBarcode(code){
  code=String(code).replace(/\D/g,''); if(!code) return null;
  if(srcOn('off')){ try{ const j=await fetchJson('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=code,product_name,brands,serving_size,serving_quantity,nutriments',2); if(j.status===1&&j.product){ const it=offNormalize({...j.product,code}); if(it) return it; } }catch(e){} }
  if(srcOn('usda')){ for(const c of [code,'0'+code]){ try{ const j=await fetchJson('https://api.nal.usda.gov/fdc/v1/foods/search?query='+c+'&pageSize=5&dataType=Branded&api_key='+encodeURIComponent(usdaKey()),2); const f=(j.foods||[]).find(x=>String(x.gtinUpc||'').replace(/^0+/,'')===c.replace(/^0+/,'')); if(f){ const it=usdaNormalize(f); if(it) return it; } }catch(e){} } }

let SCAN=null, ZX=null;
function loadZXing(){ if(window.ZXing) return Promise.resolve(); if(ZX) return ZX;
  return ZX=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=ZXING_URL; s.integrity=ZXING_SRI; s.crossOrigin='anonymous'; s.onload=()=>res(); s.onerror=()=>{ ZX=null; rej(new Error('scanner library failed to load')); }; document.head.appendChild(s); }); }
function decodeCanvas(canvas){
  const Z=window.ZXing; const hints=new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]); hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas))); const rd=new Z.MultiFormatReader(); rd.setHints(hints);
  try{ return rd.decode(bmp).getText(); }catch(e){ return null; }

/* live camera frame: try the whole frame, then the centre band at full sensor resolution (helps small barcodes) */
function frameDecode(v,cv){
  const vw=v.videoWidth, vh=v.videoHeight; if(!vw||!vh) return null;
  const w=Math.min(1280,vw), h=Math.round(w*vh/vw); cv.width=w; cv.height=h; const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(v,0,0,w,h);
  const a=decodeCanvas(cv); if(a) return a;
  const bw=Math.round(vw*.8), bh=Math.round(vh*.45); cv.width=bw; cv.height=bh; cv.getContext('2d',{willReadFrequently:true}).drawImage(v,Math.round((vw-bw)/2),Math.round((vh-bh)/2),bw,bh,0,0,bw,bh);
  return decodeCanvas(cv);
}

async function decodePhoto(file){
